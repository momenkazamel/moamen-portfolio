<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#100e0c">
<title>MK Studio · Admin</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@600;700&display=swap">
<style>
:root{--cream:#f1ede5;--ink:#1c1a17;--charcoal:#100e0c;--bronze:#9b6b42;--bronze-hi:#c08a5b;--rust:#d07a62}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--charcoal);color:var(--cream);font:15px/1.6 "IBM Plex Sans Arabic",Arial,sans-serif;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 72% 86% at 47% 44%,transparent 36%,rgba(3,2,1,.5) 100%),linear-gradient(112deg,rgba(155,107,66,.08),transparent 42%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E")}
main{position:relative;z-index:1;width:min(380px,100%);display:flex;flex-direction:column;gap:28px}
.mark{display:flex;align-items:center;gap:14px}
.mark svg{width:34px;height:41px;color:var(--cream)}
.mark span{font:600 .62rem/1.2 Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:color-mix(in srgb,var(--cream) 45%,transparent);direction:ltr}
h1{font:700 2.1rem/1.25 "Noto Naskh Arabic",Georgia,serif;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--bronze-hi)}
p.lead{color:color-mix(in srgb,var(--cream) 55%,transparent);margin-top:8px;font-size:.95rem}
form{display:flex;flex-direction:column;gap:18px}
label{display:flex;flex-direction:column;gap:8px;font-size:.78rem;color:color-mix(in srgb,var(--cream) 55%,transparent);letter-spacing:.02em}
input{font:inherit;font-size:1rem;color:var(--cream);background:transparent;border:0;border-bottom:1px solid color-mix(in srgb,var(--cream) 28%,transparent);padding:8px 2px;outline:none;direction:ltr;text-align:right;border-radius:0}
input:focus{border-bottom-color:var(--bronze-hi)}
button{font:600 1rem "IBM Plex Sans Arabic",Arial,sans-serif;margin-top:8px;border:1px solid var(--cream);background:var(--cream);color:var(--charcoal);border-radius:999px;padding:12px 18px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
button:hover{background:var(--bronze);border-color:var(--bronze);color:var(--cream)}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible{outline:2px solid var(--bronze-hi);outline-offset:3px}
.pw{position:relative;display:block}.pw input{width:100%;padding-left:56px}#eye{position:absolute;left:0;bottom:6px;margin:0;padding:4px 10px;font-size:.75rem;background:transparent;color:color-mix(in srgb,var(--cream) 60%,transparent);border:1px solid color-mix(in srgb,var(--cream) 25%,transparent)}#eye:hover{background:transparent;color:var(--cream);border-color:var(--cream)}
.err{min-height:1.4em;color:var(--rust);font-size:.88rem}
.setup{color:var(--bronze-hi);font-size:.88rem;border:1px solid color-mix(in srgb,var(--bronze) 50%,transparent);border-radius:10px;padding:10px 12px}
footer{font-size:.75rem;color:color-mix(in srgb,var(--cream) 30%,transparent)}
footer a{color:inherit}
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg viewBox="0 0 100 120" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 105 L15 15" stroke-width="6"/><path d="M55 105 L55 15" stroke-width="6"/><path d="M15 15 L35 78" stroke-width="2.4"/><path d="M35 78 L55 15" stroke-width="2.4"/><path d="M46 46 L86 13" stroke-width="2.4"/><path d="M44 66 L88 105" stroke-width="2.4"/><path d="M10 15 L20 15" stroke-width="3"/><path d="M10 105 L20 105" stroke-width="3"/><path d="M50 15 L60 15" stroke-width="3"/><path d="M50 105 L60 105" stroke-width="3"/><path d="M32 81 L38 81" stroke-width="2.4"/><path d="M81 14 L91 12" stroke-width="3"/><path d="M83 105 L93 105" stroke-width="3"/></svg>
    <span>MK Studio · Private</span>
  </div>
  <div>
    <h1>دفتر <em>حساباتي</em></h1>
    <p class="lead">المكان ده ليك انت بس. سجّل دخول عشان تفتح الدفتر.</p>
  </div>
  <!--SETUP-->
  <form id="f" autocomplete="on">
    <label>اسم المستخدم<input name="user" autocomplete="username" required autocapitalize="none" spellcheck="false"></label>
    <label>الباسورد<span class="pw"><input name="pass" type="password" autocomplete="current-password" required><button type="button" id="eye" aria-label="اظهر الباسورد">اظهر</button></span></label>
    <div class="err" id="err" role="alert"></div>
    <button type="submit" id="go">ادخل</button>
  </form>
  <footer><a href="/">moamenkazamel.com</a></footer>
</main>
<script>
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
document.getElementById('eye').onclick=e=>{const p=f.pass,show=p.type==='password';p.type=show?'text':'password';e.target.textContent=show?'اخفي':'اظهر'};
const MSG={wrong:'اسم المستخدم أو الباسورد غلط.',locked:'محاولات غلط كتير. استنى ربع ساعة وجرّب تاني.',not_configured:'اللوحة لسه محتاجة إعداد على Vercel.'};
f.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';go.disabled=true;
  try{
    const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:f.user.value,pass:f.pass.value}),credentials:'same-origin'});
    if(r.ok){location.replace('/admin'+location.hash);return}
    const j=await r.json().catch(()=>({}));err.textContent=MSG[j.error]||'حصلت مشكلة. جرّب تاني.';if(j.report){const r=j.report;err.textContent+=` [user ${r.userOk?'OK':'✗'} ${r.userPrint} · pass ${r.passOk?'OK':'✗'} ${r.passPrint} · ${r.passLength} chars]`}f.pass.value='';f.pass.focus();
  }catch{err.textContent='مفيش اتصال. اتأكد من النت.'}
  go.disabled=false;
});
</script>
</body>
</html>
